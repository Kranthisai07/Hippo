name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    # DynamoDB Local, so the repository suite runs against a real DynamoDB engine and not only the in process fake.
    # Verified on 2026-10-20 locally with the same image and no extra flags: 271 of 271 passed.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format:check

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pypdf pillow
      # Fails if any expected source quote is missing from its cited page.
      - run: python fixtures/tools/generate.py
      # The expected JSON is plain text, so it must come out identical on any machine.
      - name: Expected extractions match the committed ones
        run: git diff --exit-code -- fixtures/expected

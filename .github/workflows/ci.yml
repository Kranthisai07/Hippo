name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [obligation-kit, core]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab pypdf pillow
      # Fails if any expected source quote is missing from its cited page.
      - run: python fixtures/tools/generate.py
      # The expected JSON is plain text, so it must come out identical on any machine.
      - name: Expected extractions match the committed ones
        run: git diff --exit-code -- fixtures/expected

# Local and staging settings for the Hippo API on Cloudflare Workers. No secret belongs in this file: HIPPO_SIGNING_KEY
# is set with `wrangler secret put HIPPO_SIGNING_KEY`, and for a local run it goes in apps/edge/.dev.vars (git ignored).
name = "hippo-api"
main = "src/index.ts"
# No nodejs_compat flag: the bundle imports no Node module (apps/edge/test/bundle.test.ts keeps it that way).
compatibility_date = "2026-07-01"

[vars]
HIPPO_ISSUER = "http://localhost:8787"
HIPPO_CLIENT_ID = "hippo-demo"
HIPPO_REDIRECT_URIS = "http://localhost:5173/callback"
HIPPO_ALLOWED_ORIGINS = "http://localhost:5173"
HIPPO_MAIL_FROM = "Hippo <login@localhost>"

# The web app, built by `pnpm build:hosted`, is served by the platform from the same address as the API, so the cookie
# session needs no CORS and no cross site cookie. The paths below go to the Worker first; every other path is a file of the
# app, or index.html for an address the app handles itself (a single page app fallback). `_headers` in the app build
# carries the headers for the files (docs/VERIFIED.md 10.20).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/oauth/*", "/ext/*", "/mcp", "/mcp/*", "/.well-known/*", "/unsubscribe", "/healthz"]

# The database id is a placeholder until a real database exists (slice 6). A local run does not use it.
[[d1_databases]]
binding = "DB"
database_name = "hippo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "hippo-docs"

# Daily cleanup of expired sign in records (the Worker's scheduled handler). Cron triggers on the free plan: unverified.
[triggers]
crons = ["17 3 * * *"]

# The Email Sending binding (beta, paid plan, a verified sender domain) is added at staging:
# [[send_email]]
# name = "EMAIL"
# Without it a non production run writes the sign in code to the log instead.
